[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocr-strange"
version = "0.1.0"
description = "Clean, repair, and validate messy OCR text into structured data."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "iamzayn19", email = "iamzayn19@gmail.com" }]
keywords = ["ocr", "tesseract", "document-ai", "text-cleaning", "data-extraction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/iamzayn19/ocr-strange"
Repository = "https://github.com/iamzayn19/ocr-strange"
Issues = "https://github.com/iamzayn19/ocr-strange/issues"

[project.scripts]
ocr-strange = "ocr_strange.cli:main"

